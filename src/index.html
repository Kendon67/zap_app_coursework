
<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link href="./index.css" rel="stylesheet">
    <script src="./index.js" defer></script>

    <title>Pangolin Zap App</title>
</head>

<body>

    <nav class="navbar">
        <ul>
            <button id="sightings_page_btn">Home</button>
            <button id="map_page_btn">Map</button>
            <a>Upload Sighting</a>
            <a href="contact.html">Settings</a>
        </ul>
    </nav>

    <main>
        <section id="sightings_page">
            <h1>Pangolin Sightings</h1>
            <div id="sightings_container" class="listview">
                <!-- Placeholder cards -->

                <div class="card">
                    <h2>Rare Pangolin</h2>
                    <p>Location: Forest B</p>
                    <p>Date: 2023-10-02</p>
                </div>
                <div class="card">
                    <h2>Rare Pangolin</h2>
                    <p>Location: Forest B</p>
                    <p>Date: 2023-10-02</p>
                </div>
                <div class="card">
                    <h2>Rare Pangolin</h2>
                    <p>Location: Forest B</p>
                    <p>Date: 2023-10-02</p>
                </div>
            </div>
            <button id="upload_btn">Upload Form</button>
        </section>
    </main>

    <div id="upload_form_container" class="upload_form">
        <form class="upload_form_content" id="upload_form">

            <h2>Record a Pangolin Sighting</h2>

            <button type="button" id="add_image_btn">Add a Photo</button>

            <div id="photo_picker_container" class="photo_picker">
                <div class="photo_picker_content">
                    <div class="photo_picker_handle"></div>
                    <h3>Add a Photo</h3>

                    <button type="button" id="open_camera_btn">Take Photo with Camera</button>
                    <button type="button" id="choose_image_btn">Choose Photo from Device</button>
                    <button type="button" id="cancel_picker_btn">Cancel</button>
                </div>
            </div>

            <input type="file" id="image_input" name="image_input" accept="image/*" hidden>

            <div id="camera_container">
                <button type="button" id="close_camera_btn">Close Camera</button>
                <video id="video" autoplay playsinline></video>
                <button type="button" id="capture_btn">Capture</button>
                <canvas id="canvas" hidden></canvas>
            </div>

            <label for="species">Species:</label>
            <input type="text" id="species" name="species" required>

            <label for="status">Status:</label>
            <label>
                <input type="radio" class="status_radio" name="status" value="Alive"> Alive
            </label>
            <label>
                <input type="radio" class="status_radio" name="status" value="Dead"> Dead
            </label>

            <label for="mortality_type">Mortality type:</label>
            <select id="mortality_type" name="mortality_type">
                <option value="" disabled selected>Select Mortality Type:</option>
                <option value="Fence Death: Electrocution">Fence Death: Electrocution</option>
                <option value="Fence Death: Caught on non-electrified fence">Fence Death: Caught on non-electrified fence</option>
                <option value="Road Death">Road Death</option>
                <option value="Other">Other</option>
            </select>

            <label for="notes">Additional notes:</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

            <button type="submit" id="submit_btn">Submit Sighting</button>
            <button type="button" id="close_form_btn">Close Form</button>

        </form>
    </div>

    <div id="map_page">
        <p>Map Page!</p>
    </div>

</body>
</html>
